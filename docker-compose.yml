services:
  web:
    build: .
    container_name: webapp
    networks:
      - appnetwork
    ports:
      - "5002:5000"
    depends_on:
      - db

  nginx:
    image: nginx
    container_name: nginx-compose
    networks:
      - appnetwork
    ports:
      - "8082:80"
    volumes:
      - ./nginx-proxy/nginx-compose.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

  db:
    image: mysql:8.0
    container_name: mysql-db
    networks:
      - appnetwork
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

networks:
  appnetwork:
    driver: bridge

volumes:
  mysql-data:
